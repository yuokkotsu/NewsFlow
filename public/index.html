<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsFlow — поиск новостей</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📰 NewsFlow</h1>
            <p>Ищи новости и сохраняй в избранное</p>
        </header>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Например: технология, спорт, космос...">
            <button id="searchBtn">🔍 Искать</button>
        </div>

        <div class="results-section">
            <h2>📌 Результаты поиска</h2>
            <div id="newsContainer" class="news-grid"></div>
        </div>

        <div class="saved-section">
            <h2>⭐ Избранное</h2>
            <div id="savedContainer" class="news-grid"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
